<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Assignment 5</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header class="navbar">
    <div class="container">
      <span class="navbar-brand">Assignment 5</span>
    </div>
  </header>

  <section class="part1">
    <div class="container">
      <h2>Part 1: Profile Object, Data Types &amp; Arithmetic</h2>
      <div class="form-box" id="profileInfo"></div>
    </div>
  </section>

  <section class="part2">
    <div class="container">
      <h2>Part 2: Form Input &amp; Event Responses</h2>
      <form class="form-box" id="profileForm">
        <label for="username">Username</label>
        <input type="text" id="username" required>

        <label for="birthYear">Birth Year</label>
        <input type="number" id="birthYear" required>

        <button type="submit">Create / Update Profile</button>
      </form>
    </div>
  </section>

  <section class="part3">
    <div class="container">
      <h2>Part 3: DOM List Manipulation</h2>
      <div class="form-box">
        <ul id="hobbyList"></ul>
        <input type="text" id="newItem" placeholder="New item">
        <button id="addBtn">Add Item</button>
        <button id="removeBtn" class="secondary">Remove Item</button>
      </div>
    </div>
  </section>

  <footer>
    <p>Assignment 5 - Madina Sabyrgali, IT-2503</p>
  </footer>

  <script src="script.js"></script>
</body>
</html>
